<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>蒼海と白柱のイコサリア</title>
<meta name="description" content="FUTURE OS // ARCADIA-91 に付いてきた、という設定の見下ろし型アクション RPG。世界観・物語・ドット絵・曲は Gemini が作り、ブラウザの標準機能だけで動かしています。">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<main class="stage" aria-label="ゲームの画面">
  <canvas id="screen" aria-label="ゲームの画面。矢印キーか WASD で移動、J で攻撃、Shift でステップ、K L U でスキル、E で調べる、Tab でメニュー"></canvas>
  <p id="say" class="sr" aria-live="polite"></p>
</main>

<dialog id="menu" class="menu" aria-labelledby="menuTitle">
  <form method="dialog" class="menu-inner">
    <header class="menu-head">
      <h2 id="menuTitle">調律盤</h2>
      <div class="menu-tabs" role="tablist" aria-label="調律盤の表示">
        <button type="button" role="tab" data-tab="gear" aria-selected="true">武具</button>
        <button type="button" role="tab" data-tab="skills" aria-selected="false">煌刻樹</button>
        <button type="button" role="tab" data-tab="status" aria-selected="false">能力</button>
      </div>
      <button value="close" class="menu-close" autofocus>閉じる（Esc）</button>
    </header>
    <section class="menu-body" data-page="gear"></section>
    <section class="menu-body" data-page="skills" hidden></section>
    <section class="menu-body" data-page="status" hidden></section>
  </form>
</dialog>

<dialog id="shop" class="menu" aria-labelledby="shopTitle">
  <form method="dialog" class="menu-inner">
    <header class="menu-head"><h2 id="shopTitle">結晶商コハクの露店</h2><button value="close" class="menu-close" autofocus>閉じる（Esc）</button></header>
    <section class="menu-body" id="shopBody"></section>
  </form>
</dialog>

<script src="../../../js/logger.js"></script>
<script type="module" src="js/main.mjs"></script>
</body>
</html>
