<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>夕暮れ峠をもう一度（上から見る版）</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="main-top.js"></script>
</head>
<body>
<canvas id="stage" aria-label="上から見た峠のコースと車"></canvas>

<div class="hud" id="hud">
  <section class="hud-lap" aria-label="周回">
    <p><span class="hud-label">周</span> <span data-hud="lap">1</span></p>
    <p><span class="hud-label">時間</span> <span data-hud="time">0:00.00</span></p>
    <p><span class="hud-label">前の周</span> <span data-hud="last">-:--.--</span></p>
    <p><span class="hud-label">最速</span> <span data-hud="best">-:--.--</span></p>
  </section>
  <section class="hud-meter" aria-label="速度計">
    <p class="hud-speed"><span data-hud="speed">0</span><small>km/h</small></p>
    <p class="hud-gear"><span class="hud-label">ギア</span> <span data-hud="gear">1</span></p>
    <div class="hud-rpm" data-hud="rpm" role="presentation"></div>
  </section>
  <p class="hud-message" data-hud="message" role="status" hidden></p>
  <p class="hud-help">W 加速 ・ S ブレーキと後退 ・ A D 曲がる ・ Space サイドブレーキ ・ R 道へ戻る ・ C カメラ ・ F 自動運転 ・ Esc 一時停止</p>
</div>

<dialog id="title-dialog" aria-labelledby="title-heading">
  <h1 id="title-heading">夕暮れ峠をもう一度</h1>
  <p class="subtitle">上から見る版 ・ 全長 <span data-course="length">-</span> m</p>
  <table class="keys">
    <caption>キーボード</caption>
    <tbody>
      <tr><th scope="row"><kbd>W</kbd> または <kbd>↑</kbd></th><td>加速</td></tr>
      <tr><th scope="row"><kbd>S</kbd> または <kbd>↓</kbd></th><td>ブレーキ（止まっているときは後退）</td></tr>
      <tr><th scope="row"><kbd>A</kbd> <kbd>D</kbd> または <kbd>←</kbd> <kbd>→</kbd></th><td>曲がる</td></tr>
      <tr><th scope="row"><kbd>Space</kbd></th><td>サイドブレーキ</td></tr>
      <tr><th scope="row"><kbd>R</kbd></th><td>道の中央へ戻る</td></tr>
      <tr><th scope="row"><kbd>C</kbd></th><td>カメラ（車の向きを上 ⇔ 北を上）</td></tr>
      <tr><th scope="row"><kbd>F</kbd></th><td>自動運転の入り切り</td></tr>
      <tr><th scope="row"><kbd>Esc</kbd></th><td>一時停止</td></tr>
    </tbody>
  </table>
  <form method="dialog">
    <button value="start" autofocus>走り出す</button>
  </form>
</dialog>

<dialog id="pause-dialog" aria-labelledby="pause-heading">
  <h2 id="pause-heading">一時停止</h2>
  <form method="dialog">
    <button value="resume" autofocus>続ける</button>
    <button value="restart">最初から</button>
  </form>
</dialog>

<p class="load-error" id="load-error" hidden></p>
</body>
</html>
