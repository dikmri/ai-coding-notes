<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>わたあめサテライト（その場で再生）― AI コーディングノート</title>
<meta name="description" content="Claude が作曲し、コードで合成した kawaii future bass の曲「わたあめサテライト」を、曲に合わせて動く解析コンソールの画面と一緒にその場で再生するページ。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23c23b22'/%3E%3Ctext x='32' y='41' font-size='30' text-anchor='middle' fill='%23fff' font-family='sans-serif' font-weight='800'%3EAI%3C/text%3E%3Cpath d='M15 51H49' stroke='%23fff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@500;600&family=JetBrains+Mono:wght@500;700;800&display=swap">
<link rel="stylesheet" href="../player-ui.css">
<link rel="stylesheet" href="player.css">
<script type="module" src="../js/player.mjs"></script>
</head>
<body>
<main>
  <h1 class="visually-hidden">わたあめサテライト（その場で再生）</h1>
  <section class="wp is-fit" id="player" data-standalone aria-label="再生プレーヤー">
    <div class="wp-stage">
      <canvas id="stage" width="1920" height="1080" role="img"
        aria-label="曲に合わせて動く解析コンソールの画面。周波数のスペクトル、オシロスコープ、左右の広がり、流れる音符、16 ステップのリズム、和音、楽器ごとの LED メーター、ラウドネス、受信した出来事の記録が並ぶ。"></canvas>
    </div>
    <div class="wp-bar">
      <a class="wp-back" href="../">← レポート</a>
      <button type="button" id="play" class="wp-play" disabled>再生</button>
      <button type="button" id="restart" disabled>最初から</button>
      <label class="wp-seek">
        <span class="wp-vh">再生位置</span>
        <input type="range" id="seek" min="0" max="120" step="0.01" value="0" disabled>
      </label>
      <span id="time" class="wp-time" aria-hidden="true">0:00 / 2:00</span>
      <label class="wp-vol">
        <span>音量</span>
        <input type="range" id="volume" min="0" max="100" step="1" value="80">
      </label>
      <button type="button" id="fullscreen" aria-pressed="false" hidden>全画面</button>
      <span id="status" class="wp-status" role="status">データを読んでいます…</span>
    </div>
    <p id="now" class="wp-vh" aria-live="polite"></p>
  </section>
</main>
</body>
</html>
