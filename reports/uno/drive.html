</style></head><body><canvas tabindex="-1" aria-label="薄明峠の運転画面"></canvas><main id="menu" hidden><div class="course"><span class="mark" aria-hidden="true"></span>薄明峠サーキット</div><section class="intro"><h1 lang="en">DUSK<span>TRACE</span></h1><p class="course-data"><span>1.82 KM</span><i></i><span>高低差 44 M</span></p><button id="start" disabled><span id="startLabel">コースを準備中</span><span class="arrow" aria-hidden="true"></span></button></section><dl class="legend" aria-label="操作一覧"><div><dt><kbd>W</kbd> <span class="alt">↑</span></dt><dd>加速</dd></div><div><dt><kbd>S</kbd> <span class="alt">↓</span></dt><dd>ブレーキ・後退</dd></div><div><dt><kbd>A</kbd> <kbd>D</kbd> <span class="alt">← →</span></dt><dd>ハンドル</dd></div><div><dt><kbd>SPACE</kbd></dt><dd>サイドブレーキ</dd></div><div><dt><kbd>C</kbd></dt><dd>カメラ</dd></div><div><dt><kbd>R</kbd></dt><dd>コースへ戻る</dd></div><div><dt><kbd>M</kbd></dt><dd>音の入切</dd></div></dl></main><div id="speed" hidden><span id="digits">000</span><small>KM/H</small></div><p id="notice" hidden role="alert"></p><script type="module">const TAU=Math.PI*2,clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),mix=(a,b,k)=>a+(b-a)*k;
const smooth=(a,b,x)=>{const k=clamp((x-a)/(b-a),0,1);return k*k*(3-2*k)};
const wrap=(v,n)=>(v%n+n)%n,angle=v=>wrap(v+Math.PI,TAU)-Math.PI;
let seed=43852691;
function rand(){seed=(Math.imul(1664525,seed)+1013904223)>>>0;return seed/4294967296}
function hash(x,z){let h=Math.imul(x|0,374761393)+Math.imul(z|0,668265263);h=Math.imul(h^h>>>13,1274126177);return ((h^h>>>16)>>>0)/4294967296}
function noise(x,z){let i=Math.floor(x),j=Math.floor(z),u=x-i,v=z-j;u=u*u*(3-2*u);v=v*v*(3-2*v);return mix(mix(hash(i,j),hash(i+1,j),u),mix(hash(i,j+1),hash(i+1,j+1),u),v)}
const control=[[0,0],[0,95],[-10,155],[-57,208],[-78,255],[-58,288],[-9,295],[50,270],[100,210],[133,185],[169,190],[217,230],[244,235],[256,217],[248,193],[191,145],[174,98],[196,50],[244,10],[266,-46],[241,-103],[180,-124],[117,-103],[65,-116],[22,-95],[0,-53]];
function spline(a,b,c,d,t){return .5*((2*b)+(-a+c)*t+(2*a-5*b+4*c-d)*t*t+(-a+3*b-3*c+d)*t*t*t)}
const samples=[],N=1280,LENGTH=1820,DS=LENGTH/N,HALF=5.8;
for(let i=0;i<=control.length*64;i++){let q=Math.floor(i/64),t=i/64-q,pts=[-1,0,1,2].map(k=>control[wrap(q+k,control.length)]);let x=spline(...pts.map(v=>v[0]),t),z=spline(...pts.map(v=>v[1]),t),prev=samples.at(-1);samples.push({x,z,s:prev?prev.s+Math.hypot(prev.x-x,prev.z-z):0})}
const track=[],scale=LENGTH/samples.at(-1).s;
function roadHeight(x,z){return 13.5+13*Math.sin(z*.009-1.2)+8.2*Math.sin(x*.015+z*.003)+4.3*Math.sin(z*.019+x*.004)}
for(let i=0,j=0;i<N;i++){const s=i*DS/scale;while(samples[j+1].s<s)j++;const a=samples[j],b=samples[j+1],f=(s-a.s)/(b.s-a.s),x=mix(a.x,b.x,f)*scale,z=mix(a.z,b.z,f)*scale;track.push({x,z,y:roadHeight(x,z)})}
for(let i=0;i<N;i++){const p=track[i],a=track[wrap(i-1,N)],b=track[(i+1)%N],l=Math.hypot(b.x-a.x,b.z-a.z);p.fx=(b.x-a.x)/l;p.fz=(b.z-a.z)/l;p.yaw=Math.atan2(p.fx,p.fz);p.slope=(b.y-a.y)/l}
for(let i=0;i<N;i++){let p=track[i];p.curve=angle(track[(i+2)%N].yaw-track[wrap(i-2,N)].yaw)/(4*DS);p.bank=clamp(-p.curve*1.3,-.064,.064)}
function point(i,d=0,h=0){const p=track[wrap(i,N)];return [p.x+d*p.fz,p.y+d*p.bank+h,p.z-d*p.fx]}
function nearest(x,z,start=-1){let best=1e20,index=0;const full=start<0;for(let d=full?0:-15;d<(full?N:16);d+=full?5:1){let i=full?d:wrap(start+d,N),p=track[i],v=(p.x-x)**2+(p.z-z)**2;if(v<best){best=v;index=i}}if(full)return nearest(x,z,index);return index}
function lateral(x,z,p){return (x-p.x)*p.fz-(z-p.z)*p.fx}
function terrain(x,z,i=nearest(x,z)){const p=track[i],d=Math.hypot(p.x-x,p.z-z);const hill=noise(x*.009+8,z*.009)*22+noise(x*.03,z*.03)*5+noise(x*.12,z*.12)*1.35;
const cut=smooth(.18,.24,i/N)*(1-smooth(.34,.42,i/N))*smooth(0,1,-lateral(x,z,p));
let natural=roadHeight(x,z)-.35+smooth(10,42,d)*(hill-12+cut*22*(1-smooth(38,94,d)))-smooth(36,175,d)*(21+21*Math.sin(x*.016))+smooth(120,330,d)*hill*1.8;let apron=(1-smooth(82,108,i)+smooth(N-28,N-4,i))*(1-smooth(24,35,d));return mix(natural,p.y+((x-p.x)*p.fx+(z-p.z)*p.fz)*p.slope+lateral(x,z,p)*p.bank-.37,apron)}
const car={x:0,y:0,z:0,yaw:0,v:0,steer:0,throttle:0,brake:0,hand:false,roll:0,pitch:0,spin:0,slide:0,i:0,progress:0,lap:0,off:0,asphalt:true,t:0,frame:0};
function place(index=0,speed=0){let p=track[index];Object.assign(car,{x:p.x,y:p.y,z:p.z,yaw:p.yaw,v:speed,steer:0,throttle:0,brake:0,hand:false,roll:0,pitch:p.slope,spin:0,slide:0,i:index,progress:index/N,lap:0,off:0,asphalt:true,t:0,frame:0})}
const dt=1/60;
function drivePhysics(throttle,brake,steering,hand){const c=car;let prev=c.v,p=track[c.i];c.steer+=clamp(steering-c.steer,-.078,.078);c.throttle=throttle;c.brake=brake;c.hand=hand;
let resistance=(.36+.00105*c.v*c.v+(c.asphalt?0:Math.abs(c.v)*.23))*(c.v/(.32+Math.abs(c.v)));
let force=throttle*(c.v<0?12:10.7/(1+Math.abs(c.v)*.021))-brake*(c.v>.3?17:4.3)-resistance;
if(hand)force-=Math.sign(c.v)*Math.min(9,Math.abs(c.v)*60);c.v=clamp(c.v+force*dt,-8,58);
let wheel=c.steer*.55/(1+.029*Math.abs(c.v)),yawRate=c.v*Math.tan(wheel)/2.55*(hand?1.32:1);
c.yaw+=yawRate*dt;c.slide+=((hand?Math.min(1,Math.abs(c.v)*.08):clamp((Math.abs(yawRate*c.v)-14)*.095,0,.72))-c.slide)*.15;
const motion=c.yaw-c.steer*c.slide*.12;c.x+=Math.sin(motion)*c.v*dt;c.z+=Math.cos(motion)*c.v*dt;
let i=nearest(c.x,c.z,c.i);p=track[i];const d=lateral(c.x,c.z,p),a=angle(c.yaw-p.yaw);
c.asphalt=Math.abs(d)+Math.abs(Math.cos(a))*.86+Math.abs(Math.sin(a))*1.32<HALF;
if(!c.asphalt)c.off++;
const along=(c.x-p.x)*p.fx+(c.z-p.z)*p.fz;
let newProgress=(i+along/DS)/N,delta=wrap(newProgress-c.progress+.5,1)-.5;c.progress+=delta;c.lap=Math.max(0,Math.floor(c.progress+1e-7));c.i=i;
c.y=Math.abs(d)<HALF+1?p.y+along*p.slope+d*p.bank:mix(p.y+along*p.slope+d*p.bank,terrain(c.x,c.z,i)+.28,smooth(HALF,HALF+6,Math.abs(d)));
c.pitch+=(p.slope*Math.cos(a)-p.bank*Math.sin(a)+(c.v-prev)*.14-c.pitch)*.14;
c.roll+=(p.bank*Math.cos(a)+clamp(yawRate*c.v*.0045,-.085,.085)-c.roll)*.13;
c.spin=wrap(c.spin+c.v*dt/.318,TAU);c.frame++;c.t=c.frame/60}
const replay=new Float32Array(3600*3);
function recordLap(){place(0,35);for(let f=0;f<3600;f++){let c=car,look=clamp(4+c.v*.21,5,14),target=track[(c.i+Math.round(look/DS))%N],err=angle(Math.atan2(target.x-c.x,target.z-c.z)-c.yaw);
let steer=clamp(Math.atan(2*2.55*Math.sin(err)/look)*(1+.029*c.v)/.55,-1,1);
let v=42;for(let k=0;k<32;k+=2){let curve=Math.max(.001,Math.abs(track[(c.i+k)%N].curve));v=Math.min(v,Math.sqrt(15/curve+2*9*k*DS))}
let j=f*3;replay[j]=clamp((v-c.v)*.8+.31,0,1);replay[j+1]=clamp((c.v-v)*.24,0,1);replay[j+2]=steer;drivePhysics(replay[j],replay[j+1],replay[j+2],false)}}
recordLap();
const sub=(a,b)=>a.map((v,i)=>v-b[i]),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],unit=a=>{let l=Math.hypot(...a)||1;return a.map(x=>x/l)};
const tint=(c,v)=>c.map(x=>x*v),lerp3=(a,b,k)=>a.map((v,i)=>mix(v,b[i],k));
const glassSurfaces=[];
class Mesh {
 constructor(){this.v=[];this.idx=[];this.group=0;this.base=null}
 vert(p,n,c,m,u=0,v=0){let b=this.base;if(b){const x=p[0],z=p[2];p=[b[0]+x*b[4]+z*b[3],b[1]+p[1]+z*(b[5]||0),b[2]-x*b[3]+z*b[4]];n=[n[0]*b[4]+n[2]*b[3],n[1],-n[0]*b[3]+n[2]*b[4]]}let i=this.v.length/13;this.v.push(...p,...n,...c,u,v,m,this.group);return i}
 quad(a,b,c,d,col,m=0,uv=[[0,1],[1,1],[1,0],[0,0]]){let n=unit(cross(sub(b,a),sub(d,a))),i=this.vert(a,n,col,m,...uv[0]);this.vert(b,n,col,m,...uv[1]);this.vert(c,n,col,m,...uv[2]);this.vert(d,n,col,m,...uv[3]);this.idx.push(i,i+1,i+2,i,i+2,i+3)}
 grid(nu,nv,fn,col,m=0){if(this===windows)glassSurfaces.push({first:this.idx.length,count:nu*nv*6,center:fn(.5,.5)});let start=this.v.length/13;for(let j=0;j<=nv;j++)for(let i=0;i<=nu;i++){let u=i/nu,v=j/nv,p=fn(u,v),du=sub(fn(Math.min(1,u+.001),v),fn(Math.max(0,u-.001),v)),dv=sub(fn(u,Math.min(1,v+.001)),fn(u,Math.max(0,v-.001)));this.vert(p,unit(cross(du,dv)),col,m,u,v);if(i&&j){let k=start+j*(nu+1)+i;this.idx.push(k-nu-2,k-nu-1,k,k-nu-2,k,k-1)}}}
 box(x,y,z,w,h,l,col,m=0){let a=x-w/2,b=x+w/2,c=y-h/2,d=y+h/2,e=z-l/2,f=z+l/2;let p=[[a,c,e],[b,c,e],[b,d,e],[a,d,e],[a,c,f],[b,c,f],[b,d,f],[a,d,f]];for(let q of [[0,3,2,1],[4,5,6,7],[0,4,7,3],[1,2,6,5],[3,7,6,2],[0,1,5,4]])this.quad(...q.map(i=>p[i]),col,m)}
 tube(a,b,r,col,m=0,segments=8,r2=r){let dir=unit(sub(b,a)),ax=unit(cross(dir,Math.abs(dir[1])>.96?[1,0,0]:[0,1,0])),ay=cross(dir,ax),start=this.v.length/13;for(let j=0;j<2;j++)for(let i=0;i<=segments;i++){let t=TAU*i/segments,n=ax.map((v,k)=>v*Math.cos(t)+ay[k]*Math.sin(t)),p=(j?b:a).map((v,k)=>v+n[k]*(j?r2:r));this.vert(p,n,col,m,i/segments,j);if(i&&j){let k=start+segments+1+i;this.idx.push(k-segments-2,k-segments-1,k,k-segments-2,k,k-1)}}}
 line(pts,r,col,m=0){for(let i=1;i<pts.length;i++)this.tube(pts[i-1],pts[i],r,col,m,7)}
 oval(x,y,z,rx,ry,rz,c,m=0){this.grid(24,12,(u,v)=>{let a=TAU*u,b=(v-.5)*Math.PI;return [x+rx*Math.cos(b)*Math.cos(a),y+ry*Math.sin(b),z+rz*Math.cos(b)*Math.sin(a)]},c,m)}
}
const world=new Mesh(),body=new Mesh(),windows=new Mesh();
const dark=[.033,.041,.045],rubber=[.137,.14,.143],alloy=[.53,.57,.58],paint=[.053,.331,.358],optic=[.72,.85,.87],white=[.74,.73,.66],rust=[.73,.154,.071],steel=[.34,.38,.40],concrete=[.48,.46,.40],navy=[.055,.094,.103],yellow=[.94,.65,.12];
function ribbon(mesh,i,left,right,hl,hr,col,mat=0){let j=(i+1)%N;mesh.quad(point(i,left,hl),point(i,right,hr),point(j,right,hr),point(j,left,hl),col,mat,[[left,i*DS],[right,i*DS],[right,(i+1)*DS],[left,(i+1)*DS]])}
function mount(mesh,index,d=0){let p=track[index],a=point(index,d);mesh.base=[...a,p.fx,p.fz,p.slope]}

// Road-space survey. The same film depth drives the surface and tyre spray.
function rainBand(s){return smooth(121,153,s)*(1-smooth(285,335,s))+smooth(1660,1697,s)*(1-smooth(1783,1813,s))}
// Local depressions collect the run-off. Their size and depth vary independently between the two drainage channels.
function roadWater(s,u){
 const rain=rainBand(s);if(!rain)return 0;
 let basin=0,cell=Math.floor(s/9.5);
 for(let j=cell-2;j<=cell+2;j++)for(let bank=0;bank<2;bank++){
 let origin=(j+.18+.65*hash(j,71+bank))*9.5,ds=s-origin,center=(bank?-2.25:1.53)+2.25*(noise(j*.41,bank+86)-.5);
 let width=1.35+2.8*hash(j+3,bank+91),length=3.1+5.3*hash(j,bank+37);
 let dx=(u-center-ds*(hash(j,bank+29)-.5)*.16)/width,dz=ds/length;
 let contour=dx*dx+dz*dz+.29*dx*dz+.38*(noise(s*.27+bank,u*.80)-.5)+.16*(noise(s*.69,u*1.54)-.5);
 basin=Math.max(basin,(1.-contour)*(.59+.56*hash(j,bank+19)));}
 const depression=.09*(noise(s*.26,u*.49)-.44)+.058*(noise(s*.83+19,u*1.55)-.48);
 return rain*clamp(.09+basin+depression,0,1);}
function roadSurvey(){
 const w=256,h=4096,g=canvas2d(w,h),im=g.createImageData(w,h),deposits=new Float32Array(w);
 for(let j=0;j<h;j++){let s=(j+.5)*LENGTH/h,idx=Math.floor(s/DS)%N,curve=track[idx].curve,ahead=track[(idx+24)%N].curve;
 let apex=clamp(curve*73,-2.25,2.25)-clamp((ahead-curve)*62,-1.85,1.85),load=smooth(.002,.025,Math.abs(curve)+.56*Math.abs(ahead)),brake=smooth(.002,.018,Math.abs(ahead)-Math.abs(curve));
 deposits.fill(0);for(let lap=0;lap<37;lap++){
 let lane=apex*(.66+.68*hash(lap,19))+(hash(lap,29)-.5)*1.75+(noise(s*.013,lap*1.7)-.5)*2.1+(noise(s*.045,lap*.28)-.5)*.63;
 let pressure=load*(.21+.79*noise(s*.033,lap*3+14))**2+brake*.77;let compound=(.015+.069*hash(lap,41))*pressure;
 for(let side of [-1,1]){const center=(lane+side*(.62+.32*hash(lap,7))+HALF)*w/(2*HALF),width=(.081+.048*hash(lap,12))*w/(2*HALF);
 for(let k=Math.max(0,Math.floor(center-width*2.4));k<=Math.min(w-1,Math.ceil(center+width*2.4));k++){let lateral=(k+.5-center)/width;deposits[k]+=compound*Math.exp(-lateral*lateral*1.12);}}}
 for(let event of [125,269,382,607,681,718,801,964,1127,1383,1574,1683,sceneHair*DS-22,sceneHair*DS+4]){let length=12.+16.*hash(event,5),t=(s-event)/length;if(t<=0||t>=1)continue;
 const lane=apex*.64+.54*Math.sin(t*2.4+event)+t*t*(hash(event,51)-.46)*1.36,strength=smooth(0,.07+.19*hash(event,41),t)*(1-smooth(.35+.33*hash(event,31),1,t))*(.31+.34*hash(event,22));
 for(let side of [-1,1]){let center=(HALF+lane+side*(.71+.11*hash(event,26)))*w/(2*HALF);for(let k=Math.max(0,Math.floor(center-3));k<Math.min(w,center+3);k++){let x=(k+.5-center)/((1.33+.59*hash(event,side))*(1.-.35*t));deposits[k]+=strength*(.76+.24*side*Math.sin(t*2.1+event))*Math.exp(-Math.pow(Math.abs(x),2.6))*(.30+.70*smooth(.20,.56,noise(s*.65,event+side)));}}}
 for(let i=0;i<w;i++){let u=(i+.5)*2*HALF/w-HALF,at=(j*w+i)*4;im.data[at]=roadWater(s,u)*255;im.data[at+1]=Math.min(1,deposits[i])*255;im.data[at+2]=rainBand(s)*255;im.data[at+3]=255;}
 }g.putImageData(im,0,0);return g.canvas}

// Cabin coordinates are in metres, with the driver looking along positive Z.
function interior(){
 const suit=[.323,.380,.364],piping=[.616,.377,.182],leather=[.107,.128,.14],cloth=[.23,.248,.241],cream=[.785,.757,.642];
 const sx=-.363;
 function section(u,v,rows){const y=mix(rows[0][0],rows[rows.length-1][0],v),a=TAU*u;
 return [sx+curveTable(rows,y,1)*Math.cos(a),y,curveTable(rows,y,3)+curveTable(rows,y,2)*Math.sin(a)]}
 const torso=[[.54,.124,.119,-.054],[.62,.155,.137,-.076],[.78,.181,.144,-.096],[.91,.22,.129,-.105],[.997,.225,.110,-.110],[1.047,.099,.085,-.117]];
 body.grid(40,32,(u,v)=>section(u,v,torso),suit,35);

function resetTemporal(){historyValid=false;jitter=0;historyIndex=0;tvSector=-1;lastEyeX=lastEyeY=lastEyeZ=0}
function beginLap(){started=true;manual=false;scenePose=0;startScreen=false;place(0,35);lastLap=0;lapTime=0;clearEffects();resetTemporal();setCamera('chase');menu.hidden=true;speedOut.hidden=true}
function tick(recorded){if(recorded){let j=(car.frame%3600)*3;drivePhysics(replay[j],replay[j+1],replay[j+2],false);setCamera(car.frame<1200?'chase':car.frame<1800?'hood':car.frame<2520?'tv':'chase')}else{drivePhysics(+(keys.has('KeyW')||keys.has('ArrowUp')),+(keys.has('KeyS')||keys.has('ArrowDown')),+(keys.has('KeyD')||keys.has('ArrowRight'))-+(keys.has('KeyA')||keys.has('ArrowLeft')),keys.has('Space'));soundStep()}
 effectsStep();if(car.lap>lastLap){log('lap.complete',{lap:car.lap,seconds:car.t-lapTime},'ok');lapTime=car.t;lastLap=car.lap}}
function state(){return {started,t:car.t,frame:car.frame,x:car.x,y:car.y,z:car.z,heading:car.yaw,speedKmh:car.v*3.6,steer:car.steer,throttle:car.throttle,brake:car.brake,handbrake:car.hand,onAsphalt:car.asphalt,offAsphaltFrames:car.off,progress:car.progress,lap:car.lap,camera:cameraMode,sliding:car.slide>.16,audioOn}}
async function settle(n=9){for(let i=0;i<n;i++){render();if(i%4===3)await device.queue.onSubmittedWorkDone()}await device.queue.onSubmittedWorkDone()}
async function pose(n){if(!Number.isInteger(n)||n<1||n>6)throw RangeError('pose は1から6です。');manual=false;startScreen=false;started=false;scenePose=n;
 const idx=[0,749,470,wrap(sceneHair-5,N),142,sceneHair][n-1];place(idx,n===5?26:0);setCamera(n===3?'hood':n===4||n===6?'tv':'chase');clearEffects();if(n===5)primeWetTrail();resetTemporal();menu.hidden=true;speedOut.hidden=true;await settle()}
async function lapStep(n){if(!Number.isInteger(n)||n<0)throw RangeError('コマ数は0以上の整数です。');for(let j=0;j<n;j++){tick(true);render();if((j&7)===7)await device.queue.onSubmittedWorkDone()}await device.queue.onSubmittedWorkDone()}
function stats(values,length){const a=Array.from(values.subarray(0,length)).sort((x,y)=>x-y);if(!a.length)return {avg:null,p50:null,p99:null,max:null,over16_7:null};return {avg:a.reduce((x,y)=>x+y,0)/a.length,p50:a[Math.floor((length-1)*.5)],p99:a[Math.floor((length-1)*.99)],max:a[length-1],over16_7:a.filter(v=>v>16.7).length}}
async function endBench(){measure=false;await device.queue.onSubmittedWorkDone();let length=Math.min(measureIndex,32768),gpu=stats(cpuSamples,0);if(timeQueries){let e=device.createCommandEncoder();e.copyBufferToBuffer(queryBuffer,0,readBuffer,0,length*256);submit(e);await readBuffer.mapAsync(GPUMapMode.READ,0,length*256);let times=new BigUint64Array(readBuffer.getMappedRange(0,length*256)),v=new Float64Array(length);for(let i=0;i<length;i++)v[i]=Number(times[i*32+1]-times[i*32])/1e6;gpu=stats(v,length);readBuffer.unmap()}
 let c=stats(cpuSamples,Math.min(wallFrames,32768));window.__bench={frames:measureIndex,width:canvas.width,height:canvas.height,gpuSupported:!!timeQueries,gpu,cpu:{avg:c.avg,p99:c.p99,max:c.max},offAsphaltFrames:car.off,lapCompleted:car.lap>=1};log('bench.result',{},window.__bench)}
function raf(now){if(!started||(!manual&&mode!=='bench'))return;let elapsed=now-lastTick;if(lastTick===0)elapsed=1000/60;lastTick=now;
 if(mode==='bench'){if(!benchStart)benchStart=now;let goal=Math.min(3600,Math.floor((now-benchStart)*.060));while(car.frame<goal)tick(true);if(wallFrames<32768)cpuSamples[wallFrames]=elapsed;wallFrames++}
 else{accum+=Math.min(.18,Math.max(0,elapsed/1000));while(accum>=dt){tick(false);accum-=dt}}
 render();perfSum+=elapsed;perfFrames++;if(perfSum>=10000){log('perf.summary',{seconds:car.t,frames:perfFrames,avgMs:perfSum/perfFrames},'ok');perfSum=perfFrames=0}
 if(manual){let speed=clamp(Math.round(Math.abs(car.v)*3.6),0,300);if(speed!==lastSpeed){document.getElementById('digits').textContent=speedLabels[speed];lastSpeed=speed}}
 if(mode==='bench'&&car.frame>=3600){endBench();return}requestAnimationFrame(raf)}
function startPlay(){if(!readyFlag||mode!=='play'||started)return;manual=true;started=true;scenePose=0;startScreen=false;menu.hidden=true;speedOut.hidden=false;place();clearEffects();resetTemporal();setCamera('chase');lastLap=lapTime=0;lastTick=accum=0;startAudio();log('game.start',{mode},'ok');canvas.focus({preventScroll:true});requestAnimationFrame(raf)}
if(mode==='play'){menu.addEventListener('click',startPlay);canvas.addEventListener('click',startPlay);startButton.addEventListener('click',startPlay)}
const handled=new Set(['KeyA','KeyW','KeyS','KeyD','ArrowLeft','ArrowUp','ArrowDown','ArrowRight','Space','KeyC','KeyM','KeyR']);
function input(e){if(!manual||!handled.has(e.code))return;e.preventDefault();let down=e.type==='keydown';if(e.repeat)return;log('input.key',{code:e.code,down},'ok');if(!down){keys.delete(e.code);return}keys.add(e.code);
 if(e.code==='KeyC')setCamera(cameras[(cameras.indexOf(cameraMode)+1)%3]);if(e.code==='KeyM')toggleAudio();if(e.code==='KeyR'){let t=car.t,frame=car.frame,off=car.off,i=nearest(car.x,car.z),laps=car.lap;place(i);car.t=t;car.frame=frame;car.off=off;car.lap=laps;car.progress+=laps;clearEffects();resetTemporal();log('car.reset',{index:i},'ok')}}
addEventListener('keydown',input);addEventListener('keyup',input);addEventListener('blur',()=>keys.clear());
async function boot(){await initGpu();
 // Exercise wet glass, moving water and the presentation target during the common loading phase.
 const preview=texture(canvas.width,canvas.height,format,1,GPUTextureUsage.RENDER_ATTACHMENT);preloadView=preview.v;
 place(142,26);scenePose=5;primeWetTrail();resetTemporal();await settle(3);
 clearEffects();resetTemporal();preloadView=null;scenePose=0;preview.t.destroy();
 if(mode==='bench'){beginLap();await settle();}
 else if(mode==='shot'){await pose(1)}else{place(749);scenePose=0;startScreen=true;resetTemporal();await settle();startButton.disabled=false;document.getElementById('startLabel').textContent='クリックで開始';}await new Promise(requestAnimationFrame);readyFlag=true;if(mode==='bench'){measure=true;log('game.start',{mode},'ok');requestAnimationFrame(raf);}}
menu.hidden=mode!=='play';window.__drive={ready:boot().catch(e=>{console.error(e);log('error',{source:'initialization'},e.message);if(mode==='play'){notice.hidden=false;notice.textContent=e.message}throw e}),pose,lapStart:async()=>{beginLap();await settle()},lapStep,state};
